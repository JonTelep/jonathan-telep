<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jonathan Telep — Senior Software Engineer & Founder</title>
    <meta name="description" content="Jonathan Telep — Senior Software Engineer at Red Hat and Founder of Telep IO. Building government data transparency tools, APIs, and AI-powered intelligence platforms.">
    <meta name="keywords" content="Jonathan Telep, software engineer, Red Hat, Telep IO, web developer, API developer, government data, Ohio">
    <meta name="author" content="Jonathan Telep">
    
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Jonathan Telep — Software Engineer & Founder">
    <meta property="og:description" content="Senior Software Engineer at Red Hat. Founder of Telep IO. Building tools for government data transparency.">
    <meta property="og:url" content="https://jonathantelep.com">
    <meta property="og:site_name" content="Jonathan Telep">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Jonathan Telep — Software Engineer & Founder">
    <meta name="twitter:description" content="Senior Software Engineer at Red Hat. Founder of Telep IO.">
    <meta name="twitter:creator" content="@telep_io">
    
    <!-- Canonical -->
    <link rel="canonical" href="https://jonathantelep.com">
    
    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Jonathan Telep",
      "jobTitle": "Senior Software Engineer",
      "worksFor": [
        { "@type": "Organization", "name": "Red Hat", "url": "https://redhat.com" },
        { "@type": "Organization", "name": "Telep IO", "url": "https://telep.io" }
      ],
      "url": "https://jonathantelep.com",
      "sameAs": [
        "https://twitter.com/telep_io",
        "https://github.com/JonTelep",
        "https://telep.io"
      ],
      "knowsAbout": ["Software Engineering", "API Development", "Data Analytics", "Government Data", "AI/ML"],
      "address": { "@type": "PostalAddress", "addressRegion": "Ohio", "addressCountry": "US" }
    }
    </script>
    
    <link rel="icon" type="image/svg+xml" href="public/telep-io-logo-white.svg">
    <link rel="stylesheet" href="style.css?v=3">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div id="desktop">
        <!-- Left: Notepad++ Editor -->
        <div id="editor-panel">
            <div id="editor-menubar">
                <span class="menu-item">File</span>
                <span class="menu-item">Edit</span>
                <span class="menu-item">Search</span>
                <span class="menu-item">View</span>
                <span class="menu-item">Encoding</span>
                <span class="menu-item">Language</span>
                <span class="menu-item">Settings</span>
            </div>
            <div id="editor-toolbar">
                <span class="toolbar-btn" id="toggle-explorer" title="Toggle File Explorer">&#128193;</span>
                <span class="toolbar-divider"></span>
                <span class="toolbar-btn" title="New">&#128196;</span>
                <span class="toolbar-btn" title="Open">&#128194;</span>
                <span class="toolbar-btn" title="Save">&#128190;</span>
                <span class="toolbar-divider"></span>
                <span class="toolbar-btn" title="Cut">&#9986;</span>
                <span class="toolbar-btn" title="Copy">&#128203;</span>
                <span class="toolbar-btn" title="Paste">&#128195;</span>
                <span class="toolbar-divider"></span>
                <span class="toolbar-btn" title="Undo">&#8630;</span>
                <span class="toolbar-btn" title="Redo">&#8631;</span>
                <span class="toolbar-divider"></span>
                <span class="toolbar-btn" title="Find">&#128269;</span>
                <span class="toolbar-btn" title="Replace">&#128260;</span>
            </div>
            <div id="editor-tabs"></div>
            <div id="editor-main">
                <div id="file-explorer">
                    <div id="explorer-header">
                        <span>EXPLORER</span>
                    </div>
                    <div id="explorer-tree"></div>
                </div>
                <div id="editor-body"></div>
            </div>
            <div id="editor-statusbar">
                <span id="status-filename">new 1</span>
                <span id="status-right">
                    <span id="status-readonly">Read Only</span>
                    <span id="status-lines">Ln 1, Col 1</span>
                    <span id="status-encoding">UTF-8</span>
                    <span id="status-lang">Markdown</span>
                </span>
            </div>
        </div>

        <!-- Right: Terminal -->
        <div id="terminal">
            <div id="output"></div>
            <div class="command-line">
                <span class="prompt">~/content $</span>
                <input type="text" id="command" autocomplete="off" autocapitalize="none">
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js?v=4"></script>
</body>
</html>
