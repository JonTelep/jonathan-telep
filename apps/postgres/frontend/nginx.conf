server {
    listen 3005;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Handle the postgres-visualizer path
    # This finds files in /usr/share/nginx/html/postgres-visualizer/
    location /postgres-visualizer/ {
        try_files $uri $uri/ /postgres-visualizer/index.html;
    }

    # Static Asset Caching
    # This ensures JS/CSS files are served with the right headers
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA Fallback for any other root requests
    location / {
        try_files $uri $uri/ /postgres-visualizer/index.html;
    }

    # Disable caching for the entry point
    location = /postgres-visualizer/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}